<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Δυναμικό Ενεργειακό Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body>
    <h2>Live Παραγωγή ΑΠΕ & Θερμικών</h2>
    <div id="chart-div" style="width: 100%; height: 600px;"></div>

    <script>
        // Η fetch() διαβάζει το αρχείο που μόλις έφτιαξε το GitHub Action
        fetch('data.json')
            .then(response => response.json()) // Το μετατρέπει απευθείας σε αντικείμενο JS
            .then(data => {
                
                // Εξάγουμε τους άξονες χρησιμοποιώντας τη συνάρτηση .map()
                let x_axis = data.map(row => `${row.Date} ${row.Hour}:00`);
                
                let trace_pv = {
                    x: x_axis,
                    y: data.map(row => row.Total_PV),
                    name: 'Φωτοβολταϊκά',
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: {color: '#f39c12'} // Προαιρετικό styling
                };

                let trace_wind = {
                    x: x_axis,
                    y: data.map(row => row.Wind_SCADA),
                    name: 'Αιολικά',
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: {color: '#2980b9'}
                };

                let layout = {
                    title: 'Τηλεμετρία Συστήματος',
                    xaxis: { title: 'Χρόνος' },
                    yaxis: { title: 'Παραγωγή (MWh)' },
                    hovermode: 'x unified'
                };

                Plotly.newPlot('chart-div', [trace_pv, trace_wind], layout);
            })
            .catch(error => console.error("Σφάλμα φόρτωσης JSON:", error));
    </script>
</body>
</html>
