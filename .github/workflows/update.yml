name: Auto-Update SCADA Telemetry

on:
  schedule:
    # Τρέχει κάθε ώρα, στο λεπτό 0. Μπορείς να το αλλάξεις ανάλογα με τον ρυθμό δημοσίευσης των δεδομένων.
    - cron: '0 * * * *'
  workflow_dispatch: # Προσθέτει ένα κουμπί "Run workflow" στο GitHub για χειροκίνητη εκτέλεση

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas # Βάλε εδώ όποια άλλη βιβλιοθήκη χρειάζεσαι (π.χ. openpyxl, requests)

      - name: Run Data Update Script
        run: python update_data.py

      - name: Commit and Push new data.json
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Το '|| exit 0' αποτρέπει το να χτυπήσει error αν τα δεδομένα δεν άλλαξαν
          git commit -m "Auto-update telemetry data (JSON)" || exit 0
          git push
